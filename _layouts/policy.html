---
layout: default
---
<div class="min-h-screen bg-[#eff0f3] text-gray-800 font-body">
  <header class="p-6 md:p-10 xl:p-12">
    <a href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/images/logo.svg' | relative_url }}" alt="Morning House" class="h-10 md:h-12 xl:h-14 brightness-0 opacity-80" />
    </a>
  </header>

  <main class="px-6 md:px-10 xl:px-24 max-w-3xl pb-16 mx-auto">
    <h1 class="font-title text-3xl md:text-5xl text-gray-900 mb-2">{{ page.title }}</h1>
    <p class="text-sm text-gray-500 mb-10">Last updated: {{ page.last_updated | default: "July 2026" }}</p>

    <div class="space-y-8 font-light leading-relaxed markdown-body">
      {{ content }}
    </div>
  </main>

  <!-- Footer -->
  <footer class="p-6 md:p-10 xl:p-12 text-center border-t border-gray-200">
    <p class="text-gray-500 font-body text-[11px] md:text-xs">
      Designed and built by <a href="https://refinedislandcreations.com/" target="_blank" rel="noopener noreferrer" class="text-black/70 hover:underline underline-offset-2">Refined Island Creations</a>.
    </p>
  </footer>
</div>
<style>
.markdown-body h2 { font-weight: 700; font-size: 1.125rem; color: #111827; margin-bottom: 0.75rem; margin-top: 2rem; }
.markdown-body h2:first-child { margin-top: 0; }
.markdown-body p { margin-bottom: 1rem; }
.markdown-body ul { list-style-type: disc; padding-left: 1.25rem; margin-bottom: 1rem; }
.markdown-body ul > li { margin-bottom: 0.5rem; }
.markdown-body a { color: #b85a32; font-weight: 500; text-decoration: none; }
.markdown-body a:hover { text-decoration: underline; }
</style>
