{% assign data = include.data | default: page.final_services_cta %}
<section
  class="section relative w-full bg-cover bg-center"
  style="{% if data.background_image %}background-image: url('{{ data.background_image | relative_url }}');{% else %}background-color: #f6f4f0;{% endif %}"
>
  {% if data.background_image %}
  <!-- Overlay if background image is used -->
  <div class="absolute inset-0 bg-[#f6f4f0]/90"></div>
  {% endif %}

  <div class="relative z-10 content-wrapper flex flex-col items-center text-center max-w-3xl mx-auto py-12 md:py-20">
    {% if data.headline %}
    <h2
      class="font-title text-[#4a3628] text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold mb-6 leading-tight"
    >
      {{ data.headline }}
    </h2>
    {% endif %}
    
    {% if data.subhead %}
    <p
      class="font-body text-[#5a4a42] text-xs md:text-sm font-light mb-10 md:mb-12"
    >
      {{ data.subhead }}
    </p>
    {% endif %}
    
    {% if data.button_text %}
    <a
      href="{{ data.button_link | default: '#contact' }}"
      class="relative inline-flex items-center justify-center bg-brand-orange text-white font-body font-bold px-8 py-4 md:px-10 md:py-5 rounded-xl shadow-xl shadow-brand-orange/20 overflow-hidden group hover:shadow-brand-orange/40 transition-all transform hover:-translate-y-1 tracking-widest text-[10px] sm:text-[11px] uppercase"
    >
      <span
        class="absolute inset-0 w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent -translate-x-full group-hover:animate-[shimmer_1.5s_infinite]"
      ></span>
      <span class="relative">{{ data.button_text }}</span>
    </a>
    {% endif %}
  </div>
</section>
