<section class="w-full bg-[#f6f4f0]" id="measured">
  <!-- Top Text Area -->
  <div class="max-w-9xl mx-auto px-6 md:px-10 xl:px-24 py-16 md:py-24 text-center">
    <p class="font-body text-[#5a4a42] text-xs sm:text-sm md:text-base mb-4 tracking-wide font-light">
      {{ page.proven_results.kicker }}
    </p>
    <h2 class="font-title text-[#4a3628] text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold leading-tight">
      {{ page.proven_results.headline }}
    </h2>
  </div>

  <!-- Background Image Area -->
  <div class="relative w-full py-16 md:py-24 lg:py-32 bg-cover bg-center" style="background-image: url('{{ page.proven_results.background_image | relative_url }}');">
    <!-- Subtle overlay for text readability -->
    <div class="absolute inset-0 bg-black/30"></div>

    <div class="relative z-10 max-w-9xl mx-auto px-6 md:px-10 xl:px-24">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center">
        
        <!-- Left Column: Quote -->
        <div class="w-full">
          <h3 class="font-title text-white text-2xl sm:text-3xl md:text-4xl font-bold leading-[1.3] mb-6">
            {{ page.proven_results.quote }}
          </h3>
          <p class="font-body text-white/90 text-sm md:text-base leading-relaxed font-light max-w-md">
            {{ page.proven_results.body }}
          </p>
        </div>

        <!-- Right Column: Stats (Single Box) -->
        <div class="w-full flex justify-center lg:justify-end">
          <div class="w-full max-w-lg bg-white/10 backdrop-blur-xl border border-white/20 p-10 md:p-14 text-center text-white shadow-2xl">
            <p class="font-title text-4xl sm:text-5xl lg:text-6xl font-bold mb-4">
              {{ page.proven_results.stat_number }}
            </p>
            <p class="font-body text-sm md:text-base font-light opacity-90">
              {{ page.proven_results.stat_label }}
            </p>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
