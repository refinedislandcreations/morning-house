<section class="relative w-full py-16 md:py-24 bg-cover bg-center" style="background-image: url('{{ page.our_automation_process.background_image | relative_url }}');">
  <!-- Subtle dark overlay to ensure white text readability -->
  <div class="absolute inset-0 bg-black/30"></div>

  <div class="relative z-10 max-w-9xl mx-auto px-6 md:px-10 xl:px-24">
    
    <!-- Header -->
    <div class="mb-12 md:mb-16 max-w-3xl">
      <p class="font-body text-white/90 text-xs sm:text-sm md:text-base mb-4 tracking-wide font-light">
        {{ page.our_automation_process.kicker }}
      </p>
      <h2 class="font-title text-white text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold leading-tight">
        {{ page.our_automation_process.headline }}
      </h2>
    </div>

    <!-- Cards Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">
      
      {% for step in page.our_automation_process.steps %}
      <!-- Card -->
      <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 md:p-10 text-white shadow-2xl transition-transform hover:-translate-y-1 flex flex-col h-full">
        <span class="font-title text-2xl sm:text-3xl md:text-4xl font-bold mb-2">{{ step.number }}</span>
        <h3 class="font-title text-lg sm:text-xl md:text-2xl mb-6 font-bold">{{ step.title }}</h3>
        <p class="font-body text-xs sm:text-sm md:text-base leading-relaxed opacity-90 font-light mt-auto">
          {{ step.body }}
        </p>
      </div>
      {% endfor %}

    </div>

  </div>
</section>
