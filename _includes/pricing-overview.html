{% assign data = include.data | default: page.pricing_overview %}
<section class="section w-full bg-[#F0EDE7]" id="pricing">
  <div class="content-wrapper flex flex-col items-center text-center">
    {% if data.kicker %}
    <p
      class="font-body text-[#402518] text-xs md:text-sm mb-6 tracking-wide font-light"
    >
      {{ data.kicker }}
    </p>
    {% endif %} {% if data.headline %}
    <h2
      class="font-title text-[#402518] text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold leading-[1.2] mb-8 max-w-4xl"
    >
      {{ data.headline }}
    </h2>
    {% endif %} {% if data.body %}
    <p
      class="font-body text-[#402518] text-xs md:text-sm leading-relaxed mb-10 max-w-2xl font-light"
    >
      {{ data.body }}
    </p>
    {% endif %} {% if data.button_text %}
    <a
      href="{{ data.button_link }}"
      class="inline-flex items-center justify-center font-body font-bold px-8 py-4 md:px-10 md:py-4 rounded-xl border border-[#4a3628] text-[#402518] hover:bg-[#4a3628] hover:text-[#F0EDE7] transition-colors duration-300 tracking-widest text-[10px] sm:text-[11px] uppercase mt-2"
    >
      {{ data.button_text }}
    </a>
    {% endif %}
  </div>
</section>
