{% assign data = include.data | default: page.cross_referral %}
<section class="section w-full bg-[#F0EDE7]" id="partners">
  <div class="content-wrapper">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center">
      <!-- Left Image -->
      <img
        src="{{ data.image | relative_url }}"
        alt="Refined Island Creations"
        class="w-full max-w-md lg:max-w-none mx-auto aspect-square object-cover"
      />

      <!-- Right Content -->
      <div class="flex flex-col justify-center max-w-2xl mx-auto lg:mx-0">
        {% if data.headline %}
        <h2
          class="font-title text-[#402518] text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold mb-6 leading-[1.2]"
        >
          {{ data.headline }}
        </h2>
        {% endif %} {% if data.body %}
        <p
          class="font-body text-[#402518] text-xs md:text-sm leading-relaxed mb-10 font-light"
        >
          {{ data.body }}
        </p>
        {% endif %}
        <div>
          {% if data.button_text %}
          <a
            href="{{ data.button_link }}"
            target="_blank"
            rel="noopener noreferrer"
            class="inline-flex items-center justify-center font-body font-bold px-8 py-4 md:px-10 md:py-4 rounded-xl border border-[#4a3628] text-[#402518] hover:bg-[#4a3628] hover:text-[#F0EDE7] transition-colors duration-300 tracking-widest text-[10px] sm:text-[11px] uppercase w-full sm:w-auto text-center"
          >
            {{ data.button_text }}
          </a>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</section>
