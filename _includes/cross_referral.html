<section class="section w-full bg-[#f6f4f0]" id="partners">
  <div class="content-wrapper">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center">
      
      <!-- Left Image -->
      <img 
        src="{{ page.cross_referral.image | relative_url }}" 
        alt="Refined Island Creations"
        class="w-full max-w-md lg:max-w-none mx-auto aspect-square object-cover rounded-sm shadow-2xl" 
      />

      <!-- Right Content -->
      <div class="flex flex-col justify-center max-w-2xl mx-auto lg:mx-0">
        <h2 class="font-title text-[#4a3628] text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold mb-6 leading-[1.2]">
          {{ page.cross_referral.headline }}
        </h2>
        <p class="font-body text-[#5a4a42] text-sm md:text-base leading-relaxed mb-10 font-light">
          {{ page.cross_referral.body }}
        </p>
        <div>
          <a href="{{ page.cross_referral.button_link }}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center justify-center font-body font-bold px-8 py-4 md:px-10 md:py-4 rounded-xl border border-[#4a3628] text-[#4a3628] hover:bg-[#4a3628] hover:text-[#f6f4f0] transition-colors duration-300 tracking-widest text-[11px] sm:text-xs uppercase w-full sm:w-auto text-center">
            {{ page.cross_referral.button_text }}
          </a>
        </div>
      </div>

    </div>
  </div>
</section>
