<section class="section w-full bg-[#f6f4f0]" id="faq">
  <!-- Top Text Area -->
  <div class="mb-6 md:mb-10 content-wrapper">
    <div class="w-full">
      <p class="font-body text-[#5a4a42] text-[11px] sm:text-xs md:text-sm mb-4 tracking-wide font-light">
        {{ page.faq.kicker }}
      </p>
      <h2 class="font-title text-[#4a3628] text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold leading-tight">
        {{ page.faq.headline }}
      </h2>
    </div>
  </div>

  <!-- Background Image Area -->
  <div class="section relative w-full bg-cover bg-center bg-fixed" style="background-image: url('{{ page.faq.background_image | relative_url }}');">
    <!-- Subtle overlay for text readability -->
    <div class="absolute inset-0 bg-black/20"></div>

    <div class="relative z-10 content-wrapper">
      <div class="w-full flex flex-col gap-4">
        
        {% for item in page.faq.items %}
        <!-- FAQ Item -->
        <details {% if forloop.first %}open{% endif %} class="group bg-white/10 backdrop-blur-xl border border-white/20 text-white shadow-xl hover:bg-white/20 transition-colors duration-300">
          <summary class="flex justify-between items-center cursor-pointer p-6 md:p-10 list-none [&::-webkit-details-marker]:hidden">
            <h3 class="font-title text-base sm:text-lg md:text-xl font-bold pr-8">{{ item.question }}</h3>
            <svg class="w-4 h-4 fill-current transition-transform duration-300 group-open:-rotate-180 flex-shrink-0" viewBox="0 0 16 16">
              <path d="M14 5L8 12L2 5H14Z" />
            </svg>
          </summary>
          <div class="px-6 md:px-10 pb-6 md:pb-10 pt-0">
            <p class="font-body text-xs md:text-sm opacity-90 font-light leading-relaxed">
              {{ item.answer }}
            </p>
          </div>
        </details>
        {% endfor %}

      </div>
    </div>
  </div>
</section>
