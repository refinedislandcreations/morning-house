<section class="w-full bg-[#f6f4f0]" id="faq">
  <!-- Top Text Area -->
  <div class="max-w-9xl mx-auto px-6 md:px-10 xl:px-24 pt-16 md:pt-24 pb-12">
    <div class="w-full">
      <p class="font-body text-[#5a4a42] text-xs sm:text-sm md:text-base mb-4 tracking-wide font-light">
        {{ page.faq.kicker }}
      </p>
      <h2 class="font-title text-[#4a3628] text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold leading-tight">
        {{ page.faq.headline }}
      </h2>
    </div>
  </div>

  <!-- Background Image Area -->
  <div class="relative w-full py-16 md:py-24 bg-cover bg-center" style="background-image: url('{{ page.faq.background_image | relative_url }}');">
    <!-- Subtle overlay for text readability -->
    <div class="absolute inset-0 bg-black/20"></div>

    <div class="relative z-10 max-w-9xl mx-auto px-6 md:px-10 xl:px-24">
      <div class="w-full flex flex-col gap-4">
        
        {% for item in page.faq.items %}
        <!-- FAQ Item -->
        <details {% if forloop.first %}open{% endif %} class="group bg-white/10 backdrop-blur-xl border border-white/20 text-white shadow-xl hover:bg-white/20 transition-colors duration-300">
          <summary class="flex justify-between items-center cursor-pointer p-6 md:p-10 list-none [&::-webkit-details-marker]:hidden">
            <h3 class="font-title text-lg sm:text-xl md:text-2xl font-bold pr-8">{{ item.question }}</h3>
            <svg class="w-4 h-4 fill-current transition-transform duration-300 group-open:-rotate-180 flex-shrink-0" viewBox="0 0 16 16">
              <path d="M14 5L8 12L2 5H14Z" />
            </svg>
          </summary>
          <div class="px-6 md:px-10 pb-6 md:pb-10 pt-0">
            <p class="font-body text-sm md:text-base opacity-90 font-light leading-relaxed">
              {{ item.answer }}
            </p>
          </div>
        </details>
        {% endfor %}

      </div>
    </div>
  </div>
</section>
