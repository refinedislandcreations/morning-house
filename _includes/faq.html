{% assign data = include.data | default: page.faq %}
<section class="section w-full bg-[#F0EDE7]" id="faq">
  <!-- Top Text Area -->
  <div class="mb-6 md:mb-10 content-wrapper">
    <div class="w-full">
      {% if data.kicker %}
      <p
        class="font-body text-[#402518] text-[11px] sm:text-xs md:text-sm mb-4 tracking-wide font-light"
      >
        {{ data.kicker }}
      </p>
      {% endif %} {% if data.headline %}
      <h2
        class="font-title text-[#402518] text-xl sm:text-2xl md:text-3xl lg:text-4xl font-bold leading-tight"
      >
        {{ data.headline }}
      </h2>
      {% endif %}
    </div>
  </div>

  <!-- Background Image Area -->
  <div
    class="section relative w-full bg-cover bg-center bg-fixed"
    style="background-image: url('{{ data.background_image | relative_url }}');"
  >
    <!-- Subtle overlay for text readability -->
    <div class="absolute inset-0 bg-black/20"></div>

    <div class="relative z-10 content-wrapper">
      <div class="w-full flex flex-col gap-4">
        {% if data.items %} {% for item in data.items %}
        <!-- FAQ Item -->
        <details
          class="faq-item group bg-[#FFFFFF]/10 backdrop-blur-xl border border-[#FFFFFF]/20 text-[#FFFFFF] shadow-xl hover:bg-[#FFFFFF]/20 transition-colors duration-300"
        >
          <summary
            class="faq-summary flex justify-between items-center cursor-pointer px-6 py-4 md:px-10 md:py-6 list-none [&::-webkit-details-marker]:hidden"
          >
            <h3
              class="font-title text-base sm:text-lg md:text-xl font-bold pr-8"
            >
              {{ item.question }}
            </h3>
            <svg
              class="faq-icon w-4 h-4 fill-current flex-shrink-0"
              viewBox="0 0 16 16"
            >
              <path d="M14 5L8 12L2 5H14Z" />
            </svg>
          </summary>
          <div class="faq-content-wrapper overflow-hidden">
            <div class="px-6 md:px-10 pb-6 md:pb-10 pt-0">
              <p
                class="font-body text-xs md:text-sm opacity-90 font-light leading-relaxed"
              >
                {{ item.answer }}
              </p>
            </div>
          </div>
        </details>
        {% endfor %} {% endif %}
      </div>
    </div>
  </div>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    if (typeof gsap === "undefined") return;

    const faqItems = document.querySelectorAll(".faq-item");
    
    faqItems.forEach(item => {
      const summary = item.querySelector(".faq-summary");
      const content = item.querySelector(".faq-content-wrapper");
      const icon = item.querySelector(".faq-icon");
      
      gsap.set(content, { overflow: "hidden" });

      if (item.hasAttribute("open")) {
        gsap.set(icon, { rotation: 180 });
      } else {
        gsap.set(content, { height: 0, opacity: 0 });
        gsap.set(icon, { rotation: 0 });
      }

      let isAnimating = false;

      summary.addEventListener("click", (e) => {
        e.preventDefault();
        
        if (isAnimating) return;
        isAnimating = true;

        const isOpen = item.hasAttribute("open");

        if (isOpen) {
          gsap.to(icon, { rotation: 0, duration: 0.3, ease: "power2.out" });
          gsap.to(content, {
            height: 0,
            opacity: 0,
            duration: 0.3,
            ease: "power2.out",
            onComplete: () => {
              item.removeAttribute("open");
              isAnimating = false;
            }
          });
        } else {
          item.setAttribute("open", "");
          gsap.to(icon, { rotation: 180, duration: 0.3, ease: "power2.out" });
          gsap.fromTo(content,
            { height: 0, opacity: 0 },
            { 
              height: "auto", 
              opacity: 1, 
              duration: 0.3, 
              ease: "power2.out",
              onComplete: () => {
                isAnimating = false;
              }
            }
          );
        }
      });
    });
  });
</script>
</section>
