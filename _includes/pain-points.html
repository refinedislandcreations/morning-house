<section class="section w-full bg-[#f6f4f0]">
  <div class="max-w-9xl mx-auto px-6 md:px-10 xl:px-24">
    <!-- Top Text -->
    <div class="text-center mb-12 md:mb-16">
      <p class="font-body text-[#5a4a42] text-xs sm:text-sm md:text-base mb-4 tracking-wide font-light">{{ page.pain_points.kicker }}</p>
      <h2 class="font-title text-[#4a3628] text-2xl sm:text-3xl md:text-4xl lg:text-5xl leading-tight font-bold">
        {{ page.pain_points.headline }}
      </h2>
    </div>
  </div>

  <!-- Image & Cards Section -->
  <div class="w-full relative py-16 md:py-24 bg-cover bg-center" style="background-image: url('{{ page.pain_points.background_image | relative_url }}');">
    <div class="relative z-10 max-w-9xl mx-auto px-6 md:px-10 xl:px-24">
      <div class="grid grid-cols-1 md:grid-cols-3 gap-6 md:gap-8">
        
        {% for card in page.pain_points.cards %}
        <!-- Card -->
        <div class="bg-white/10 backdrop-blur-xl border border-white/20 p-8 md:p-10 text-white shadow-2xl transition-transform hover:-translate-y-1">
          <svg class="w-6 h-6 mb-6 opacity-90" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            {{ card.icon }}
          </svg>
          <h3 class="font-title text-lg sm:text-xl md:text-2xl mb-4 font-bold">{{ card.title }}</h3>
          <p class="font-body text-xs sm:text-sm md:text-base leading-relaxed opacity-90 font-light">
            {{ card.body }}
          </p>
        </div>
        {% endfor %}

      </div>
    </div>
  </div>

  <div class="max-w-9xl mx-auto px-6 md:px-10 xl:px-24 mt-16 md:mt-24 pb-16 md:pb-24 text-center">
    <h2 class="font-title text-[#4a3628] text-2xl sm:text-3xl md:text-4xl lg:text-5xl leading-tight font-bold">
      {{ page.pain_points.bottom_headline }}
    </h2>
  </div>

  <!-- Image Break Section -->
  <div class="relative w-full h-[60vh] min-h-[400px] md:min-h-[500px] lg:min-h-[600px] flex flex-col justify-end bg-cover bg-[70%_center] md:bg-[80%_center] bg-no-repeat" style="background-image: url('{{ page.pain_points.background_image | relative_url }}');">
    <!-- Subtle Gradient Overlay to ensure text readability -->
    <div class="absolute inset-0 bg-gradient-to-t from-black/50 via-black/10 to-transparent"></div>
    
    <div class="relative z-10 w-full max-w-9xl mx-auto px-6 md:px-10 xl:px-24 pb-12 md:pb-16 flex justify-end">
      <h2 class="text-white font-title text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold leading-tight text-right drop-shadow-lg">
        {{ page.pain_points.image_break_headline }}
      </h2>
    </div>
  </div>
</section>
