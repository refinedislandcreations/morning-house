<section class="w-full bg-[#f6f4f0] py-16 md:py-24" id="about">
  <div class="max-w-9xl mx-auto px-6 md:px-10 xl:px-24">
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-20 items-center">
      
      <!-- Left Image -->
      <img 
        src="{{ page.founder_story.image | relative_url }}" 
        alt="{{ page.founder_story.alt_text }}"
        class="w-full aspect-square lg:aspect-[4/5] object-cover rounded-sm shadow-2xl" 
      />

      <!-- Right Content -->
      <div class="flex flex-col justify-center max-w-2xl mx-auto lg:mx-0">
        <p class="font-body text-[#5a4a42] text-xs sm:text-sm md:text-base mb-6 tracking-wide font-light">
          {{ page.founder_story.kicker }}
        </p>
        <h2 class="font-title text-[#4a3628] text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold mb-8 leading-[1.2]">
          {{ page.founder_story.quote }}
        </h2>
        <p class="font-body text-[#5a4a42] text-xs sm:text-sm md:text-base leading-relaxed mb-10 font-light">
          {{ page.founder_story.body }}
        </p>
        <div>
          <p class="font-body text-[#4a3628] font-bold text-sm md:text-base">
            {{ page.founder_story.name }} <span class="font-light text-[#5a4a42]">{{ page.founder_story.title }}</span>
          </p>
        </div>
      </div>

    </div>
  </div>
</section>
