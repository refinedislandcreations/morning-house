<style>
  @keyframes shimmer {
    100% {
      transform: translateX(100%);
    }
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    // Check if GSAP is loaded
    if (typeof gsap === "undefined") {
      console.warn("GSAP is not loaded. Animations will be disabled.");
      return;
    }

    const navbar = document.getElementById("navbar");
    const mobileMenuBtn = document.getElementById("mobile-menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");
    const mobileLinks = document.querySelectorAll(".mobile-link");
    let menuOpen = false;

    // --- Mobile Accordion Variables ---
    const mobileDropdownBtn = document.querySelector(".mobile-dropdown-btn");
    const mobileDropdownMenu = document.querySelector(".mobile-dropdown-menu");
    const mobileDropdownIcon = mobileDropdownBtn
      ? mobileDropdownBtn.querySelector("svg")
      : null;
    let dropdownOpen = false;

    // --- Initial Load Animation ---
    gsap.from(".nav-logo, .nav-item, .nav-btn, .nav-btn-mobile", {
      y: -20,
      opacity: 0,
      duration: 0.8,
      ease: "power3.out",
      delay: 0.2,
      clearProps: "all",
      onComplete: () => {
        document.querySelector(".nav-btn").classList.add("transition-all");
      },
    });

    // --- Scroll Effect ---
    window.addEventListener("scroll", () => {
      if (window.scrollY > 30) {
        navbar.classList.remove("bg-transparent", "py-6", "md:py-8");
        navbar.classList.add(
          "bg-[#7B6558]/95",
          "backdrop-blur-xl",
          "py-4",
          "md:py-5",
          "shadow-2xl",
          "shadow-black/50",
        );
      } else {
        if (!menuOpen) {
          // Keep the state if menu is open
          navbar.classList.add("bg-transparent", "py-6", "md:py-8");
          navbar.classList.remove(
            "bg-[#7B6558]/95",
            "backdrop-blur-xl",
            "py-4",
            "md:py-5",
            "shadow-2xl",
            "shadow-black/50",
          );
        }
      }
    });

    // --- Mobile Menu Toggle Animation ---
    // Prepare mobile menu state
    gsap.set(mobileMenu, {
      display: "none",
      opacity: 0,
      clipPath: "circle(0% at 100% 0%)",
    });
    gsap.set(mobileLinks, { y: 30, opacity: 0 });

    mobileMenuBtn.addEventListener("click", () => {
      if (!menuOpen) {
        // Open Mobile Menu
        menuOpen = true;
        // Transform hamburger to X morphing
        gsap.to(".menu-icon-line-1", {
          rotation: 45,
          y: 5,
          transformOrigin: "50% 50%",
          duration: 0.3,
          ease: "power2.inOut",
        });
        gsap.to(".menu-icon-line-2", { opacity: 0, duration: 0.3 });
        gsap.to(".menu-icon-line-3", {
          rotation: -45,
          y: -5,
          transformOrigin: "50% 50%",
          duration: 0.3,
          ease: "power2.inOut",
        });

        // Show menu via circular clip-path reveal
        gsap.to(mobileMenu, {
          display: "flex",
          opacity: 1,
          clipPath: "circle(150% at 100% 0%)",
          duration: 0.6,
          ease: "power3.inOut",
        });

        // Show links simultaneously
        gsap.to(mobileLinks, {
          y: 0,
          opacity: 1,
          duration: 0.5,
          ease: "back.out(1.2)",
          delay: 0.3,
        });
      } else {
        // Close Mobile Menu
        menuOpen = false;
        // Transform X back to hamburger
        gsap.to(".menu-icon-line-1", {
          rotation: 0,
          y: 0,
          duration: 0.3,
          ease: "power2.inOut",
        });
        gsap.to(".menu-icon-line-2", { opacity: 1, duration: 0.3 });
        gsap.to(".menu-icon-line-3", {
          rotation: 0,
          y: 0,
          duration: 0.3,
          ease: "power2.inOut",
        });

        // Hide links and sublinks simultaneously
        gsap.to([mobileLinks, ".mobile-sublink"], {
          y: -20,
          opacity: 0,
          duration: 0.3,
          ease: "power2.in",
        });

        // Hide menu
        gsap.to(mobileMenu, {
          clipPath: "circle(0% at 100% 0%)",
          opacity: 0,
          duration: 0.5,
          ease: "power3.inOut",
          delay: 0.2,
          onComplete: () => {
            gsap.set(mobileMenu, { display: "none" });
            if (window.scrollY <= 30) {
              navbar.classList.add("bg-transparent", "py-6", "md:py-8");
              navbar.classList.remove(
                "bg-[#7B6558]/95",
                "backdrop-blur-xl",
                "py-4",
                "md:py-5",
                "shadow-2xl",
                "shadow-black/50",
              );
            }

            // Reset dropdown state silently for next open
            if (dropdownOpen) {
              dropdownOpen = false;
              if (mobileDropdownIcon)
                gsap.set(mobileDropdownIcon, { rotation: 0 });
              if (mobileDropdownMenu) {
                mobileDropdownMenu.classList.add("hidden");
                mobileDropdownMenu.classList.remove("flex");
                gsap.set(mobileDropdownMenu, { opacity: 0, height: 0 });
              }
            }

            // Reset sublinks position for next open
            gsap.set(".mobile-sublink", { y: 0, opacity: 1 });
          },
        });
      }
    });

    // --- Mobile Accordion ---
    if (mobileDropdownBtn && mobileDropdownMenu) {
      mobileDropdownBtn.addEventListener("click", () => {
        dropdownOpen = !dropdownOpen;
        if (dropdownOpen) {
          gsap.to(mobileDropdownIcon, { rotation: 180, duration: 0.3 });
          mobileDropdownMenu.classList.remove("hidden");
          mobileDropdownMenu.classList.add("flex");
          gsap.fromTo(
            mobileDropdownMenu,
            { opacity: 0, height: 0 },
            { opacity: 1, height: "auto", duration: 0.3 },
          );
        } else {
          gsap.to(mobileDropdownIcon, { rotation: 0, duration: 0.3 });
          gsap.to(mobileDropdownMenu, {
            opacity: 0,
            height: 0,
            duration: 0.3,
            onComplete: () => {
              mobileDropdownMenu.classList.add("hidden");
              mobileDropdownMenu.classList.remove("flex");
            },
          });
        }
      });
    }

    // --- Desktop Dropdown Click Toggle ---
    const desktopDropdownBtn = document.getElementById("desktop-dropdown-btn");
    const desktopDropdownMenu = document.getElementById("desktop-dropdown-menu");
    const desktopDropdownIcon = document.getElementById("desktop-dropdown-icon");
    let desktopDropdownOpen = false;

    if (desktopDropdownBtn && desktopDropdownMenu) {
      desktopDropdownBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        desktopDropdownOpen = !desktopDropdownOpen;
        if (desktopDropdownOpen) {
          desktopDropdownMenu.classList.add("!opacity-100", "!visible", "!translate-y-0");
          if (desktopDropdownIcon) desktopDropdownIcon.classList.add("!rotate-180");
        } else {
          desktopDropdownMenu.classList.remove("!opacity-100", "!visible", "!translate-y-0");
          if (desktopDropdownIcon) desktopDropdownIcon.classList.remove("!rotate-180");
        }
      });

      // Close when clicking outside
      document.addEventListener("click", (e) => {
        if (desktopDropdownOpen && !desktopDropdownBtn.contains(e.target) && !desktopDropdownMenu.contains(e.target)) {
          desktopDropdownOpen = false;
          desktopDropdownMenu.classList.remove("!opacity-100", "!visible", "!translate-y-0");
          if (desktopDropdownIcon) desktopDropdownIcon.classList.remove("!rotate-180");
        }
      });
    }

    // Auto-close mobile menu when a link is clicked
    mobileLinks.forEach((link) => {
      if (!link.classList.contains("mobile-dropdown-btn")) {
        link.addEventListener("click", () => {
          if (menuOpen) mobileMenuBtn.click();
        });
      }
    });

    const mobileSublinks = document.querySelectorAll(".mobile-sublink");
    mobileSublinks.forEach((link) => {
      link.addEventListener("click", () => {
        if (menuOpen) mobileMenuBtn.click();
      });
    });
  });
</script>
