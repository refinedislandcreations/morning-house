<style>
  @keyframes shimmer {
    100% { transform: translateX(100%); }
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    // Check if GSAP is loaded
    if (typeof gsap === 'undefined') {
      console.warn('GSAP is not loaded. Animations will be disabled.');
      return;
    }

    const navbar = document.getElementById('navbar');
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    const mobileLinks = document.querySelectorAll('.mobile-link');
    let menuOpen = false;

    // --- Initial Load Animation ---
    gsap.from(".nav-logo, .nav-item, .nav-btn, .nav-btn-mobile", {
      y: -20,
      opacity: 0,
      duration: 0.8,
      ease: "power3.out",
      delay: 0.2,
      clearProps: "all",
      onComplete: () => {
        document.querySelector('.nav-btn').classList.add('transition-all');
      }
    });

    // --- Scroll Effect ---
    window.addEventListener('scroll', () => {
      if (window.scrollY > 30) {
        navbar.classList.remove('bg-transparent', 'py-6', 'md:py-8');
        navbar.classList.add('bg-[#7B6558]/95', 'backdrop-blur-xl', 'py-4', 'md:py-5', 'shadow-2xl', 'shadow-black/50');
      } else {
        if (!menuOpen) { // Keep the state if menu is open
          navbar.classList.add('bg-transparent', 'py-6', 'md:py-8');
          navbar.classList.remove('bg-[#7B6558]/95', 'backdrop-blur-xl', 'py-4', 'md:py-5', 'shadow-2xl', 'shadow-black/50');
        }
      }
    });

    // --- Mobile Menu Toggle Animation ---
    // Prepare mobile menu state
    gsap.set(mobileMenu, { display: "none", opacity: 0, clipPath: "circle(0% at 100% 0%)" });
    gsap.set(mobileLinks, { y: 30, opacity: 0 });

    mobileMenuBtn.addEventListener('click', () => {
      if (!menuOpen) {
        // Open Mobile Menu
        menuOpen = true;
        // Transform hamburger to X morphing
        gsap.to(".menu-icon-line-1", { rotation: 45, y: 5, transformOrigin: "50% 50%", duration: 0.3, ease: "power2.inOut" });
        gsap.to(".menu-icon-line-2", { opacity: 0, duration: 0.3 });
        gsap.to(".menu-icon-line-3", { rotation: -45, y: -5, transformOrigin: "50% 50%", duration: 0.3, ease: "power2.inOut" });
        
        // Show menu via circular clip-path reveal
        gsap.to(mobileMenu, { 
          display: "flex", 
          opacity: 1, 
          clipPath: "circle(150% at 100% 0%)", 
          duration: 0.6, 
          ease: "power3.inOut" 
        });
        
        // Show links simultaneously
        gsap.to(mobileLinks, { 
          y: 0, 
          opacity: 1, 
          duration: 0.5, 
          ease: "back.out(1.2)", 
          delay: 0.3 
        });
        
      } else {
        // Close Mobile Menu
        menuOpen = false;
        // Transform X back to hamburger
        gsap.to(".menu-icon-line-1", { rotation: 0, y: 0, duration: 0.3, ease: "power2.inOut" });
        gsap.to(".menu-icon-line-2", { opacity: 1, duration: 0.3 });
        gsap.to(".menu-icon-line-3", { rotation: 0, y: 0, duration: 0.3, ease: "power2.inOut" });
        
        // Hide links simultaneously
        gsap.to(mobileLinks, { 
          y: -20, 
          opacity: 0, 
          duration: 0.3, 
          ease: "power2.in" 
        });
        
        // Hide menu
        gsap.to(mobileMenu, { 
          clipPath: "circle(0% at 100% 0%)", 
          opacity: 0, 
          duration: 0.5, 
          ease: "power3.inOut", 
          delay: 0.2,
          onComplete: () => {
            gsap.set(mobileMenu, { display: "none" });
            if (window.scrollY <= 30) {
              navbar.classList.add('bg-transparent', 'py-6', 'md:py-8');
              navbar.classList.remove('bg-[#7B6558]/95', 'backdrop-blur-xl', 'py-4', 'md:py-5', 'shadow-2xl', 'shadow-black/50');
            }
          }
        });
      }
    });
    
    // Auto-close mobile menu when a link is clicked
    mobileLinks.forEach(link => {
      link.addEventListener('click', () => {
        if(menuOpen) mobileMenuBtn.click();
      });
    });
  });
</script>
