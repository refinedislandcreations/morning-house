<section class="w-full bg-[#f6f4f0] py-16 md:py-24">
  <div class="max-w-9xl mx-auto px-6 md:px-10 xl:px-24">
    <div class="w-full bg-[#7B6558] rounded-3xl p-10 md:p-16 lg:p-20 shadow-xl flex flex-col lg:flex-row items-center justify-between gap-12 lg:gap-16">
      
      <!-- Left Content -->
      <div class="w-full lg:w-3/5 text-center lg:text-left">
        <p class="font-body text-white/80 text-sm md:text-base mb-4 tracking-wide font-light">
          {{ page.free_consultation_cta.kicker }}
        </p>
        <h2 class="font-title text-white text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-bold mb-6 leading-tight">
          {{ page.free_consultation_cta.headline }}
        </h2>

      <!-- Right Content -->
      <div class="w-full lg:w-auto flex flex-col items-center flex-shrink-0">
        <a href="{{ page.free_consultation_cta.button_link }}" class="relative inline-flex items-center justify-center bg-brand-orange text-white font-body font-bold px-8 py-4 md:px-10 md:py-5 rounded-xl shadow-xl shadow-brand-orange/20 overflow-hidden group hover:shadow-brand-orange/40 transition-all transform hover:-translate-y-1 tracking-widest text-[11px] sm:text-xs uppercase w-full md:w-auto text-center mb-4">

        <p class="font-body text-white/70 text-xs md:text-sm font-light">
          {{ page.free_consultation_cta.button_subtext }}
        </p>
      </div>

    </div>
  </div>
